name: Lab CI
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'tools/**'
      - 'scripts/**'
  pull_request:
permissions:
  contents: read
concurrency:
  group: lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Verify lab tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f AGENTS.md
          test -f pom.xml
          if git config --local --get-regexp 'http.*extraheader' >/dev/null; then
            echo 'Unexpected persisted HTTP authentication header' >&2
            exit 1
          fi
      - name: Verify runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(. /etc/os-release; printf '%s' "$ID")" = ubuntu
          printf 'Ubuntu x86_64 runner ready\n'
